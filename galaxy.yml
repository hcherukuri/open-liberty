---
namespace: middleware_automation
name: open_liberty
version: 1.0.0
readme: README.md
authors:
  - Harsha Cherukuri <hcheruku@redhat.com>
description: >
  Ansible collection to install, configure, and manage IBM Open Liberty
  application server. Supports Core Profile, Web Profile, and Platform (Full Platform)
  standalone installations. Includes roles for application deployment,
  version updates, and HTTP/HTTPS port configuration.
license:
  - GPL-2.0-only
license_file: LICENSE
tags:
  - openliberty
  - liberty
  - java
  - jakarta
  - microprofile
  - middleware
  - install
  - deploy
  - upgrade
  - networking
  - ibm
repository: https://github.com/ansible-middleware/open-liberty
documentation: https://github.com/ansible-middleware/open-liberty
homepage: https://openliberty.io
issues: https://github.com/ansible-middleware/open-liberty/issues
dependencies:
  community.general: ">=6.0.0"
  ansible.posix: ">=1.4.0"
build_ignore:
  - molecule
  - .github
  - .DS_Store
  - '*.tar.gz'
  - '*.zip'
  - .ansible
  - requirements.txt
