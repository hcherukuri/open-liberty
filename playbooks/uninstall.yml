---
# Stop the service and remove installation files, unit, and optional user/group.
#   ansible-playbook -i inventory.ini playbooks/uninstall.yml \
#     -e openliberty_remove_user=true -e openliberty_remove_group=true
- name: Uninstall Open Liberty
  hosts: liberty_servers
  gather_facts: true
  vars:
    openliberty_server_name: defaultServer
    openliberty_install_dir: /opt/openliberty
    openliberty_user: liberty
    openliberty_group: liberty
    openliberty_remove_user: true
    openliberty_remove_group: true
  roles:
    - role: middleware_automation.open_liberty.uninstall
