---
# uninstall – main task entry point
# Stop the service and remove installation files, unit, and optional user/group.
- name: Stop and disable Open Liberty service
  ansible.builtin.systemd:
    name: "{{ openliberty_service_name }}"
    state: stopped
    enabled: false
  become: true
  failed_when: false  # service may already be stopped or not installed

- name: Remove systemd unit file
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ openliberty_service_name }}.service"
    state: absent
  become: true
  notify: Reload systemd daemon

- name: Reload systemd so the unit disappears from the registry
  ansible.builtin.systemd:
    daemon_reload: true
  become: true

- name: Remove Open Liberty installation directory
  ansible.builtin.file:
    path: "{{ openliberty_install_dir }}"
    state: absent
  become: true

# The install role sets home={{ openliberty_install_dir }}. After that path is
# gone, userdel -r can fail; use userdel -f and ignore a missing home.
- name: Remove system user
  ansible.builtin.command:
    argv:
      - userdel
      - -f
      - "{{ openliberty_user }}"
  become: true
  when: openliberty_remove_user | bool
  register: _openliberty_userdel
  changed_when: _openliberty_userdel.rc == 0
  failed_when: >-
    _openliberty_userdel.rc not in [0, 6]
    and ('does not exist' not in (_openliberty_userdel.stderr | default('')))

- name: Remove system group
  ansible.builtin.command:
    argv:
      - groupdel
      - "{{ openliberty_group }}"
  become: true
  when: openliberty_remove_group | bool
  register: _openliberty_groupdel
  changed_when: _openliberty_groupdel.rc == 0
  failed_when: >-
    _openliberty_groupdel.rc not in [0, 6]
    and ('does not exist' not in (_openliberty_groupdel.stderr | default('')))
