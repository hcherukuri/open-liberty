---
- name: Verify wlp/bin/server script exists
  ansible.builtin.stat:
    path: "{{ openliberty_home }}/bin/server"
  register: _openliberty_server_script

- name: Fail if server script is missing
  ansible.builtin.fail:
    msg: >
      Open Liberty installation at {{ openliberty_home }} appears incomplete —
      {{ openliberty_home }}/bin/server was not found.
      Check the archive download and extraction steps.
  when: not _openliberty_server_script.stat.exists

- name: Ensure server binary is executable
  ansible.builtin.file:
    path: "{{ openliberty_home }}/bin/server"
    mode: "0755"
    owner: "{{ openliberty_user }}"
    group: "{{ openliberty_group }}"
  become: true
  when: >
    not (_openliberty_server_script.stat.xusr
         or _openliberty_server_script.stat.xgrp)

- name: Confirm Open Liberty installation
  ansible.builtin.debug:
    msg: "Open Liberty installation verified at {{ openliberty_home }}."
