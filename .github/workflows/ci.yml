---
name: CI
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 6 * * *'

jobs:
  galaxy-importer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core galaxy-importer

      - name: Build collection
        run: ansible-galaxy collection build .

      - name: Run galaxy-importer
        run: python -m galaxy_importer.main middleware_automation-open_liberty-*.tar.gz

  # Use @main (ubuntu-22.04 for molecule). @rootperm runs molecule on
  # ubuntu-latest and has been failing all scenarios on this fork.
  ci:
    uses: ansible-middleware/github-actions/.github/workflows/ci.yml@main
    secrets: inherit
    with:
      fqcn: 'middleware_automation/open_liberty'
      molecule_tests: >-
        [ "default", "app_deploy", "microprofile", "port_config", "uninstall", "validation", "version_update" ]
