---
name: Documentation
on:
  push:
    branches:
      - main
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  # The shared docs workflow requests pages:write and fails at startup on forks
  # where GitHub Pages is not enabled. Upstream (ansible-middleware/open-liberty)
  # should call ansible-middleware/github-actions/.github/workflows/docs.yml@main.
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Skip documentation publish on fork
        if: ${{ github.repository != 'ansible-middleware/open-liberty' }}
        run: echo "Documentation publish runs only on ansible-middleware/open-liberty"

      - name: Remind upstream maintainers to restore reusable docs workflow
        if: ${{ github.repository == 'ansible-middleware/open-liberty' }}
        run: |
          echo "::error::Restore the reusable docs workflow call before merging to ansible-middleware/open-liberty"
          exit 1
