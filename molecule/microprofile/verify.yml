---
- name: Verify MicroProfile installation
  hosts: all
  gather_facts: true

  tasks:
    - name: Check wlp directory exists
      ansible.builtin.stat:
        path: /opt/openliberty/wlp
      register: _wlp_dir
      failed_when: not _wlp_dir.stat.exists

    - name: Check systemd unit file exists
      ansible.builtin.stat:
        path: /etc/systemd/system/openliberty-microServer.service
      register: _unit_file
      failed_when: not _unit_file.stat.exists

    - name: Check service is active
      ansible.builtin.systemd:
        name: openliberty-microServer
      register: _svc
      become: true
      failed_when: _svc.status.ActiveState != 'active'

    - name: Wait for HTTP port 9080
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: 9080
        timeout: 120

    - name: Query /health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:9080/health"
        method: GET
        status_code: 200
        timeout: 10
      register: _health
      retries: 12
      delay: 10
      until: _health.status == 200
