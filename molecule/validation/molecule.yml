---
# validation role against a running microProfile instance.
# Platforms from .config/molecule/config.yml.

provisioner:
  name: ansible
  env:
    ANSIBLE_FORCE_COLOR: "true"
  playbooks:
    prepare: ../prepare.yml
    converge: converge.yml
    verify: verify.yml
    cleanup: ../default/cleanup.yml
  inventory:
    group_vars:
      all:
        openliberty_version: "24.0.0.9"
        openliberty_edition: microProfile
        openliberty_server_name: defaultServer
        openliberty_http_port: 9080
        openliberty_install_java: true
        openliberty_validate_health_endpoint: true
        openliberty_health_url_path: "/health"
        openliberty_validation_timeout: 300
        openliberty_validation_delay: 10

verifier:
  name: ansible
