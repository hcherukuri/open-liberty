---
# converge.yml – port_config scenario
# Phase 1: install Open Liberty on ports 9080/9443 (defaults).
# Phase 2: reconfigure to ports 8080/8443 via port_config role.
- name: Converge – Port Configuration
  hosts: all
  gather_facts: true

  tasks:
    - name: Install Open Liberty
      ansible.builtin.include_role:
        name: middleware_automation.open_liberty.install

    - name: Configure server on default ports (9080/9443)
      ansible.builtin.include_role:
        name: middleware_automation.open_liberty.server_config
      vars:
        openliberty_http_port: 9080
        openliberty_https_port: 9443

    - name: Enable and start Open Liberty service
      ansible.builtin.include_role:
        name: middleware_automation.open_liberty.systemd

    - name: Wait for Open Liberty to come up on port 9080
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: 9080
        timeout: 120
        delay: 5

    - name: Reconfigure HTTP port to 8080 (HTTPS disabled in this scenario)
      ansible.builtin.include_role:
        name: middleware_automation.open_liberty.port_config
      vars:
        openliberty_http_port: 8080
        openliberty_https_port: 8443
        openliberty_https_enabled: false
        openliberty_endpoint_host: "*"
        openliberty_firewall_port_manage: false

    # include_role handlers are not always flushed by meta:flush_handlers in the
    # parent play; restart explicitly so the new listener is bound before probes.
    - name: Restart Open Liberty to apply new httpEndpoint ports
      ansible.builtin.systemd:
        name: "openliberty-{{ openliberty_server_name | default('defaultServer') }}"
        state: restarted
      become: true

    - name: Wait until systemd reports the service active after restart
      ansible.builtin.systemd:
        name: "openliberty-{{ openliberty_server_name | default('defaultServer') }}"
      register: _ol_svc
      become: true
      retries: 30
      delay: 2
      until: (_ol_svc.status.ActiveState | default('')) == 'active'

    - name: Wait for Open Liberty to come up on new port 8080
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: 8080
        timeout: 120
        delay: 5
