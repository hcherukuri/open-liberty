---
# verify.yml – uninstall scenario
# Asserts that the uninstall role removed all Open Liberty artefacts.
- name: Verify uninstall
  hosts: all
  gather_facts: false

  tasks:
    - name: Assert installation directory was removed
      ansible.builtin.stat:
        path: /opt/openliberty
      register: _install_dir
      failed_when: _install_dir.stat.exists | default(false)

    - name: Assert unit file was removed
      ansible.builtin.stat:
        path: /etc/systemd/system/openliberty-defaultServer.service
      register: _unit_file
      failed_when: _unit_file.stat.exists | default(false)

    - name: Check service is not active
      ansible.builtin.systemd:
        name: openliberty-defaultServer
      register: _svc
      become: true
      failed_when: false

    - name: Assert service is not running
      ansible.builtin.assert:
        that:
          - (_svc.status.ActiveState | default('unknown')) in ['inactive', 'failed', 'unknown']
            or (_svc.failed | default(false))
        fail_msg: >-
          openliberty-defaultServer is still active after uninstall
          (state: {{ _svc.status.ActiveState | default('n/a') }})
        success_msg: "Service is not running"

    # Prefer getent(1) rc over the getent module: with fail_key=false the module
    # still inserts the key into ansible_facts (value None), which breaks
    # "'liberty' not in dict" asserts.
    - name: Check liberty user is absent
      ansible.builtin.command:
        cmd: getent passwd liberty
      register: _liberty_user
      changed_when: false
      failed_when: false

    - name: Assert liberty user was removed
      ansible.builtin.assert:
        that: _liberty_user.rc != 0
        fail_msg: "liberty user still exists – uninstall did not remove the system user"
        success_msg: "liberty user was removed"

    - name: Check liberty group is absent
      ansible.builtin.command:
        cmd: getent group liberty
      register: _liberty_group
      changed_when: false
      failed_when: false

    - name: Assert liberty group was removed
      ansible.builtin.assert:
        that: _liberty_group.rc != 0
        fail_msg: "liberty group still exists – uninstall did not remove the system group"
        success_msg: "liberty group was removed"

    - name: Confirm HTTP port 9080 is closed
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: 9080
        state: stopped
        timeout: 30
        msg: "Port 9080 is still open after uninstall – Open Liberty may still be running"
